<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador Web</title>
</head>
<body>

<div class="header">
  <div class="Logo">Logo</div>
  <div class="menu-nav">
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Servicios</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </div>
</div>

<div class="container">
  Formulario de cotizacion
  <br><br>

  <label for="nombre">Nombre del cliente:
    <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Lopez">
  </label>
  <br><br>

  <label for="paginas">Numero de paginas:
    <input type="number" id="paginas" name="paginas" placeholder="Ej 5">
  </label>
  <br><br>

  <label for="dominio">Dominio:
    <input class="form-check-input" type="checkbox" id="dominio" name="dominio" data-precio="600">
    
  </label>
  <br><br>

  <label for="hosting">Hosting:
    <input class="form-check-input" type="checkbox" id="hosting" name="hosting" data-precio="1500">
  </label>
  <br><br>

  <label for="basedatos">Base de datos:
    <input class="form-check-input" type="checkbox" id="basedatos" name="basedatos" data-precio="7000">
  </label>
  <br><br>

  <button type="button" id="btnCalcular">Calcular cotizacion</button>
  <button type="button" id="btnLimpiar">Limpiar</button>

  <div class="resultado" id="resultado">
    Resultado: aun no hay cotizacion
  </div>
</div>

<div class="footer">
  2026 Derechos Reservados
</div>
<script>
  const dominio=document.querySelector("#dominio");
  const hosting=document.querySelector("#hosting");
  const basedatos=document.querySelector("#basedatos");
  //Seo
  //paginas extra
  //
  var total=0;

  //Event listener
 
  //Hosting
  hosting.addEventListener("click", function(){
  
    if(hosting.checked){
    total += parseInt(hosting.dataset.precio);
    console.log("Hosting seleccionado, su total es de " +total);
  }else{
    total -= parseInt(hosting.dataset.precio);
    console.log("Hosting no seleccionado, su total es de " + total);
  }
  //total
  document.getElementById("total").textContent = total;
}); 

  //Dominio

dominio.addEventListener("click", function(){
  if(dominio.checked){
    console.log("Dominio seleccionado");
  }else{
    console.log("Dominio no seleccionado");
  }
}); 
//Base de datos





  
  console.log(dominio.dataset + "," + hosting.dataset.precio);
  console.log(Number(dominio.dataset.precio) + Number(hosting.dataset.precio));

  if(hosting.checked){
    console.log("Hosting seleccionado");
  }else{
    console.log("Hosting no seleccionado");
  }

</script>
</body>
</html>
